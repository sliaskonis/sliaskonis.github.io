<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/img/favicon-32.png">
<link rel="apple-touch-icon" href="{{ site.baseurl }}/img/apple-touch-icon.png">
<meta property="og:title" content="{{site.title}}" />
<meta property="og:description" content="{{site.description}}" />
<meta property="og:type" content="website" />
<meta property="og:url" content="{{site.url}}" />
<meta property="og:site_name" content="{{site.name}}" />
<meta property="og:image" content="{{site.cover}}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:type" content="image/png" />
<meta property="og:image:alt" content="{{site.name}} - {{site.tagline}}" />
<meta property="og:locale" content="en_US">
<meta name="author" content="{{site.name}}">
<meta name="description" content="{{site.description}}">
<meta name="keywords" content="Spiros Liaskonis, computer engineering, FPGA, hardware acceleration, machine learning, HLS, reinforcement learning, edge AI, University of Thessaly">
<meta itemprop="name" content="{{site.title}}">
<meta itemprop="description" content="{{site.description}}">
<meta itemprop="image" content="{{site.cover}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="{{site.url}}">
<meta name="twitter:site" content="@SpirosLiaskonis">
<meta name="twitter:creator" content="@SpirosLiaskonis">
<meta name="twitter:title" content="{{site.title}}">
<meta name="twitter:description" content="{{site.description}}">
<meta name="twitter:image" content="{{site.cover}}">
<meta name="twitter:image:alt" content="{{site.name}} - {{site.tagline}}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.name }}",
  "url": "{{ site.url }}",
  "image": "{{ site.logo }}",
  "email": "{{ site.email }}",
  "jobTitle": "Computer Engineering Student",
  "worksFor": {
    "@type": "Organization",
    "name": "TIMA Laboratory, Université Grenoble Alpes"
  },
  "alumniOf": {
    "@type": "CollegeOrUniversity",
    "name": "University of Thessaly"
  },
  "knowsAbout": ["FPGA", "Hardware Acceleration", "Efficient Deep Learning", "Neural Network Quantization", "Edge AI", "High Performance Computing"],
  "sameAs": [
{%- assign profiles = site.social | where_exp: "s", "s.url contains 'http'" -%}
{% for s in profiles %}    "{{ s.url }}"{% unless forloop.last %},{% endunless %}
{% endfor %}  ]
}
</script>
<script>
  /* Set the theme before first paint to avoid a flash.
     Priority: saved choice > system preference > time of day (7pm–7am = night).
     Block comments only: the compress layout collapses this script onto one
     line, so a // comment would swallow everything after it. */
  (function() {
    try {
      var stored = localStorage.getItem('theme');
      var night;
      if (stored === 'night') {
        night = true;
      } else if (stored === 'day') {
        night = false;
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        night = true;
      } else {
        var hours = new Date().getHours();
        night = hours >= 19 || hours <= 7;
      }
      if (night) {
        document.documentElement.classList.add('night');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', '#171c28');
        }
      }
    } catch (e) {}
  })();
</script>
<link rel="preload" href="{{ site.baseurl }}/fonts/apercu/Apercu-Light.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ site.baseurl }}/fonts/apercu/Apercu-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ site.baseurl }}/fonts/apercu/Apercu-Bold.woff2" as="font" type="font/woff2" crossorigin>

{% endif %}
